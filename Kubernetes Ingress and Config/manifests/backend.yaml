apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
  namespace: devops-config
  labels:
    app: devops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
    spec:
      containers:
      - name: backend
        image: python:3.12-alpine
        command:
        - sh
        - -c
        - |
          python3 -c "
          import os
          from http.server import HTTPServer, BaseHTTPRequestHandler

          FIELDS = ['ENVIRONMENT', 'LOG_LEVEL', 'DEFAULT_CAMPUS',
                    'SESSION_TIMEOUT_MIN']

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass
              def do_GET(self):
                  lines = ['DevOps Backend API', '==================']
                  for f in FIELDS:
                      lines.append(f'{f:<20}: ' + os.getenv(f, 'unset'))
                  body = ('\n'.join(lines) + '\n').encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
          "
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: devops-app-config
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: devops-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devops-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: devops-db-secret
              key: POSTGRES_DB
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: devops-backend-service
  namespace: devops-config
  labels:
    app: devops-backend
spec:
  type: ClusterIP
  selector:
    app: devops-backend
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
