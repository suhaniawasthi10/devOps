apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recreate
      track: recreate
  template:
    metadata:
      labels:
        app: recreate
        track: recreate
    spec:
      containers:
      - name: web
        image: nginx:alpine
        command:
        - sh
        - -c
        - echo v2 > /usr/share/nginx/html/index.html; exec nginx -g "daemon off;"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
  strategy:
    type: Recreate
