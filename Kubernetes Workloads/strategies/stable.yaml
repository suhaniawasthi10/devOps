apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
      - name: web
        image: nginx:alpine
        command:
        - sh
        - -c
        - echo stable > /usr/share/nginx/html/index.html; exec nginx -g "daemon off;"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
