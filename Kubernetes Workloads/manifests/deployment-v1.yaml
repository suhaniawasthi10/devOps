apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
  labels:
    app: devops-backend
    version: 1.0.0
  namespace: devops-workloads
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
        version: 1.0.0
    spec:
      containers:
      - name: backend
        image: python:3.12-alpine
        command:
        - sh
        - -c
        - mkdir -p /tmp/site && printf "Backend v1.0.0\n" > /tmp/site/index.html &&
          exec python3 -m http.server 5000 --directory /tmp/site
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 3
