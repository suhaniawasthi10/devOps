apiVersion: v1
kind: Pod
metadata:
  name: shared-emptydir
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - date > /shared/time; sleep 3600
    volumeMounts:
    - name: shared
      mountPath: /shared
  - name: reader
    image: busybox:1.37
    command:
    - sh
    - -c
    - while true; do cat /shared/time 2>/dev/null || true; sleep 5; done
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    emptyDir: {}
