apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-portal
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: broken-portal
      track: broken-portal
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:no-such-tag-coursework
        command:
        - sh
        - -c
        - echo v1 > /usr/share/nginx/html/index.html; exec nginx -g "daemon off;"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
        envFrom:
        - configMapRef:
            name: portal-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: broken-portal
  ports:
  - name: http
    port: 80
    targetPort: 81
