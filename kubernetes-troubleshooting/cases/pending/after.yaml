apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-pending
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: trouble-pending
      track: trouble-pending
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:alpine
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-pending
spec:
  selector:
    app: trouble-pending
  ports:
  - name: http
    port: 80
    targetPort: 80
