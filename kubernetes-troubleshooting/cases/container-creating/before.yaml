apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-container-creating
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: trouble-container-creating
      track: trouble-container-creating
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:alpine
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /lab-secret
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: trouble-container-creating-secret
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-container-creating
spec:
  selector:
    app: trouble-container-creating
  ports:
  - name: http
    port: 80
    targetPort: 80
