# Optional credentials for the manual deployment workflow. Apply only to its lab namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: devops-release
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coursework-deployer
  namespace: devops-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coursework-deployer
  namespace: devops-release
rules:
  - apiGroups: ['']
    resources: [configmaps, secrets, services, persistentvolumeclaims, pods, pods/log, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coursework-deployer
  namespace: devops-release
subjects:
  - kind: ServiceAccount
    name: coursework-deployer
    namespace: devops-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coursework-deployer
