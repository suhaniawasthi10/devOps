apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-http-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: request
      image: busybox:1.37
      command: [wget]
      args: ['-qO-', 'http://{{ .Release.Name }}:{{ .Values.service.port }}/readyz']
